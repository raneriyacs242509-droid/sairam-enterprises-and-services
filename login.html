
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Sairam Enterprises</title>
<link rel="stylesheet" href="style.css">

<style>
.auth-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
    background: #0b1117;
}

.auth-box {
    width: 100%;
    max-width: 430px;
    padding: 38px;
    background: #111c26;
    border: 1px solid rgba(214,168,79,.3);
    border-radius: 15px;
    box-shadow: 0 15px 45px rgba(0,0,0,.3);
}

.auth-box h1 {
    color: #d6a84f;
    text-align: center;
    margin-bottom: 10px;
}

.auth-subtitle {
    color: #aab2bb;
    text-align: center;
    margin-bottom: 28px;
}

.auth-box label {
    display: block;
    color: #f4f5f6;
    margin: 16px 0 8px;
}

.auth-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #45515c;
    border-radius: 7px;
    background: #0b1117;
    color: white;
    outline: none;
}

.auth-box input:focus {
    border-color: #d6a84f;
}

.auth-submit {
    width: 100%;
    margin-top: 24px;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #d6a84f;
    color: #101820;
    font-weight: bold;
    cursor: pointer;
}

.auth-submit:hover {
    background: #e4bc6a;
}

.auth-links {
    text-align: center;
    margin-top: 20px;
    color: #aab2bb;
    line-height: 2;
}

.auth-links a {
    color: #d6a84f;
    text-decoration: none;
}

.auth-error {
    color: #ff8585;
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="auth-page">
    <div class="auth-box">

        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Login to Sairam Enterprises</p>

        <form id="loginForm">

            <label>Email Address</label>
            <input type="email" id="email"
                placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password"
                placeholder="Enter your password" required>

            <button class="auth-submit" type="submit">
                Login
            </button>

            <p class="auth-error" id="error"></p>

        </form>

        <div class="auth-links">
            Don't have an account?
            <a href="register.html">Register Now</a>
            <br>
            <a href="admin-login.html">Admin Login</a>
        </div>

    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const errorBox = document.getElementById("error");
    errorBox.textContent = "Please wait...";

    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            errorBox.textContent = data.message || "Login failed.";
            return;
        }

        sessionStorage.setItem("customerToken", data.token);
        window.location.href = "index.html";

    } catch (error) {
        errorBox.textContent = "Unable to connect to server.";
    }
});
</script>

</body>
</html>
